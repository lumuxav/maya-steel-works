name: Maya pre-launch regression tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logic-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Maya repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exactly locked packages
        run: npm ci
      - name: Run Maya financial and calendar regression tests
        run: npm run test:logic
      - name: Lint Maya business rules and tests
        run: npx eslint lib/mayaBusiness.mjs tests/maya-business-logic.test.mjs
      - name: Build Maya Next.js application (no live database access)
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-public-key-no-live-access
        run: npm run build
      - name: Smoke-test Maya pages and anonymous API denial
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-public-key-no-live-access
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-server-key-no-live-access
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 >/tmp/maya-next.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:3000/login >/dev/null; then break; fi
            sleep 1
          done
          node scripts/maya-route-smoke.mjs

  atomic-ledger-database:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: maya-test-only
          POSTGRES_DB: maya_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d maya_fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout Maya repository
        uses: actions/checkout@v4
      - name: Run isolated PostgreSQL Maya transaction and RLS tests
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: maya-test-only
          PGDATABASE: maya_fixture
        run: |
          psql -X -v ON_ERROR_STOP=1 -f tests/postgres/maya_fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/postgres/maya_premigration_policies.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261009_maya_atomic_ledger_and_rls.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/postgres/maya_ledger_integration.sql
