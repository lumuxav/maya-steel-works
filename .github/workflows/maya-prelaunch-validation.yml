name: Maya pre-launch regression tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logic-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Maya repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exactly locked packages
        run: npm ci
      - name: Run Maya financial and calendar regression tests
        run: npm run test:logic
      - name: Lint Maya business rules and tests
        run: npx eslint lib/mayaBusiness.mjs lib/mayaPasswordPolicy.mjs lib/mayaBackup.mjs tests/maya-business-logic.test.mjs tests/maya-password-policy.test.mjs tests/maya-backup.test.mjs lib/mayaReportData.mjs lib/mayaPeriodReport.mjs lib/mayaPeriodApi.mjs tests/maya-period-report.test.mjs app/profit/page.js app/api/reports/period/route.js
      - name: Build Maya Next.js application (no live database access)
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-public-key-no-live-access
        run: npm run build
      - name: Install isolated browser test runtime
        run: npx playwright install --with-deps chromium
      - name: Verify mobile and desktop period reports with synthetic data
        run: npm run test:browser
      - name: Smoke-test Maya pages and anonymous API denial
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-public-key-no-live-access
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-server-key-no-live-access
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 >/tmp/maya-next.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:3000/login >/dev/null; then break; fi
            sleep 1
          done
          node scripts/maya-route-smoke.mjs

  atomic-ledger-database:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout Maya repository
        uses: actions/checkout@v4
      - name: Start preinstalled PostgreSQL 16 locally
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres pg_isready
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -c "CREATE DATABASE maya_fixture;"
      - name: Run isolated Maya transaction and RLS regression tests
        run: |
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d maya_fixture -f tests/postgres/maya_fixture.sql
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d maya_fixture -f tests/postgres/maya_premigration_policies.sql
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d maya_fixture -f supabase/migrations/20261009_maya_atomic_ledger_and_rls.sql
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d maya_fixture -f tests/postgres/maya_ledger_integration.sql
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d maya_fixture -f supabase/migrations/20261009_maya_atomic_corrections_and_grants.sql
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d maya_fixture -f tests/postgres/maya_corrections_integration.sql
      - name: Exercise encryption, decryption and isolated PostgreSQL restore
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends age
          sudo -u postgres pg_dump -Fc --no-owner --no-acl -f /tmp/maya-synthetic.dump maya_fixture
          sudo chmod 644 /tmp/maya-synthetic.dump
          age-keygen -o "$RUNNER_TEMP/maya-synthetic-identity.txt" >/dev/null 2>&1
          AGE_RECIPIENT="$(age-keygen -y "$RUNNER_TEMP/maya-synthetic-identity.txt")"
          MAYA_BACKUP_AGE_RECIPIENT="  $AGE_RECIPIENT "
          export MAYA_BACKUP_AGE_RECIPIENT
          CLEAN_RECIPIENT="$(node --input-type=module -e '
            import {normalizeMayaBackupRecipient} from "./lib/mayaBackup.mjs"
            process.stdout.write(normalizeMayaBackupRecipient(process.env.MAYA_BACKUP_AGE_RECIPIENT))
          ')"
          age -r "$CLEAN_RECIPIENT" -o "$RUNNER_TEMP/maya-synthetic.age" /tmp/maya-synthetic.dump
          age -d -i "$RUNNER_TEMP/maya-synthetic-identity.txt" -o "$RUNNER_TEMP/maya-synthetic-restored.dump" "$RUNNER_TEMP/maya-synthetic.age"
          cmp /tmp/maya-synthetic.dump "$RUNNER_TEMP/maya-synthetic-restored.dump"
          sudo cp "$RUNNER_TEMP/maya-synthetic-restored.dump" /tmp/maya-synthetic-restored.dump
          sudo chmod 644 /tmp/maya-synthetic-restored.dump
          sudo -u postgres createdb maya_synthetic_restore
          sudo -u postgres pg_restore --exit-on-error --no-owner --no-acl -d maya_synthetic_restore /tmp/maya-synthetic-restored.dump
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d maya_synthetic_restore -c "SELECT count(*) AS restored_sales FROM public.sales"
