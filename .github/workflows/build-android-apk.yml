name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'capacitor.config.json'
      - 'app/components/NativeBackNavigation.js'
      - 'app/layout.js'
      - 'mobile-shell/**'
      - 'assets/logo.svg'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Maya Steel Works APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Android SDK
        shell: bash
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install project dependencies
        run: npm ci

      - name: Install Android packaging tools
        run: npm install --no-save @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 @capacitor/assets@3 @capacitor/keyboard@8 @capacitor/app@8

      - name: Create Android project
        run: npx cap add android

      - name: Generate Maya app icon and splash assets
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#111827' --iconBackgroundColorDark '#111827' --splashBackgroundColor '#1f3f70' --splashBackgroundColorDark '#111827'

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build directly installable debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Prepare APK file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Maya-Steel-Works.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Maya-Steel-Works-APK
          path: Maya-Steel-Works.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: maya-latest
          name: Maya Steel Works — Latest Android
          body: Latest direct-install Android APK built automatically from the main branch.
          files: Maya-Steel-Works.apk
          make_latest: true
