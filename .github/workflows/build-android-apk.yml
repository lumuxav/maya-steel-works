name: Build Android APK

on:
  pull_request:
    branches:
      - main
    paths:
      - 'android-native/**'
      - 'app/components/NativeBackNavigation.js'
      - 'app/records/page.js'
      - 'app/mobile-native.css'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'capacitor.config.json'
      - 'app/components/NativeBackNavigation.js'
      - 'android-native/**'
      - 'app/layout.js'
      - 'mobile-shell/**'
      - 'assets/logo.svg'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Maya Steel Works APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Android SDK
        shell: bash
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install project dependencies
        run: npm ci

      - name: Verify Maya financial calculations before packaging
        run: npm run test:logic

      - name: Install Android packaging tools
        run: npm install --no-save @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 @capacitor/assets@3 @capacitor/keyboard@8 @capacitor/app@8 @capacitor/filesystem@8 @capacitor/share@8

      - name: Create Android project
        run: npx cap add android

      - name: Generate Maya app icon and splash assets
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#111827' --iconBackgroundColorDark '#111827' --splashBackgroundColor '#1f3f70' --splashBackgroundColorDark '#111827'

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Install Maya native Android Back navigation
        run: |
          mkdir -p android/app/src/main/java/com/mayasteelworks/management
          cp android-native/MainActivity.java android/app/src/main/java/com/mayasteelworks/management/MainActivity.java
          grep -q "handleMayaBack" android/app/src/main/java/com/mayasteelworks/management/MainActivity.java

      - name: Set Android release version
        env:
          MAYA_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python - <<'PYCODE'
          import json, os, pathlib, re
          path = pathlib.Path('android/app/build.gradle')
          text = path.read_text()
          version = json.loads(pathlib.Path('package.json').read_text())['version']
          text, codes = re.subn(r'versionCode [0-9]+', 'versionCode ' + str(100 + int(os.environ['MAYA_BUILD_NUMBER'])), text)
          text, names = re.subn(r'versionName "[^"]+"', 'versionName "' + version + '"', text)
          assert codes == 1 and names == 1, 'Android version fields were not found'
          path.write_text(text)
          PYCODE

      - name: Build directly installable debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Prepare APK file
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Maya-Steel-Works.apk
          sha256sum Maya-Steel-Works.apk > SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Maya-Steel-Works-APK
          path: Maya-Steel-Works.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable download release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: maya-android-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Maya Steel Works — Android Build #${{ github.run_number }}
          body: |
            Latest official Android build of Maya Steel Works from the main branch.
            Version 0.2.0: financial period reports with inclusive Uganda date ranges,
            cash reconciliation, debt payments, estimated profit and CSV export.
            Operating history begins Saturday, 31 October 2026.
            The same features are live on the desktop and iPhone web/PWA app.
            Web app: https://maya-steel-works-mgt.vercel.app
            Existing native Back navigation and double-Back exit are retained.
            Download Maya-Steel-Works.apk below and install it on Android.
            If Android reports a signing conflict with an older debug APK,
            uninstall the old APK before installing this version.
          files: |
            Maya-Steel-Works.apk
            SHA256SUMS.txt
          make_latest: true
