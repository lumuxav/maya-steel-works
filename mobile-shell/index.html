<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1f3f70" />
  <title>Maya Steel Works</title>
  <style>
    :root { color-scheme: light dark; font-family: Arial, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111827; color: #f8fafc; }
    main { width: min(92vw, 420px); text-align: center; padding: 32px; }
    .mark { width: 76px; height: 76px; margin: 0 auto 18px; display: grid; place-items: center; border-radius: 20px; background: #1f3f70; font-weight: 800; font-size: 28px; }
    h1 { margin: 0 0 10px; font-size: 24px; }
    p { margin: 0; opacity: .75; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <div class="mark">MS</div>
    <h1>Maya Steel Works</h1>
    <p>Internet connection is required to load the live management system.</p>
  </main>
</body>
</html>
